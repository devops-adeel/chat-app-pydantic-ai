[project]
name = "chat-app-pydantic-ai"
version = "0.1.0"
description = "Personal chat assistant with web search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-ai[ag-ui]>=0.1.0",
    "tavily-python>=0.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "restate-sdk>=0.17.1",
    "graphiti-core[anthropic,neo4j]>=0.29.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "coverage>=7.0",
    "ruff>=0.8",
    "ty>=0.0.1a0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config"]
# Repo-root modules (memory.py, restate_service.py, chat_app.py) live at the top
# level, not in a package — put the root on sys.path for imports.
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
